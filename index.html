<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cifra</title>
<style>
:root{color-scheme:light;--bg:#f5f5f7;--fg:#1d1d1f;--mut:#86868b;--card:#fff;--bd:rgba(0,0,0,.08);--acc:#0071e3;--fill:#f5f5f7;--them:#e9e9eb;--ok:#34c759;--err:#ff3b30;--wrk:#ff9500}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;
 padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.blob{display:none}
.view{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;animation:in .7s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.hide{display:none!important}
.card{width:100%;max-width:380px;padding:36px 28px 28px;border-radius:28px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.08)}
h1{margin:0 0 6px;font-size:34px;line-height:1.1;letter-spacing:-.04em;font-weight:700;text-align:center}
.sub{color:var(--mut);font-size:15px;margin:0 0 28px;text-align:center}
input{width:100%;padding:15px 16px;margin-bottom:10px;border-radius:14px;border:1.5px solid transparent;background:var(--fill);color:var(--fg);font:inherit;font-size:16px;outline:0;transition:border-color .2s,background .2s,box-shadow .2s}
input::placeholder{color:#a1a1a6}
input:focus{background:#fff;border-color:var(--acc);box-shadow:0 0 0 4px rgba(0,113,227,.15)}
button{font:inherit;cursor:pointer;border:0;transition:transform .2s cubic-bezier(.3,1.4,.5,1),background .2s,opacity .2s}
.go{width:100%;padding:15px;border-radius:99px;margin-top:8px;font-weight:600;font-size:16px;color:#fff;background:var(--acc)}
.go:hover{background:#0077ed;transform:scale(1.015)}.go:active{transform:scale(.97)}.go:disabled{opacity:.5;cursor:default}
.pill{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;font-size:13px;color:var(--mut);min-height:20px;text-align:center}
.dot{width:7px;height:7px;border-radius:50%;background:#c7c7cc;flex:none;transition:background .3s}
.pill[data-k=wait] .dot,.pill[data-k=work] .dot{background:var(--wrk);animation:pulse 1.3s ease-in-out infinite}
.pill[data-k=ok] .dot{background:var(--ok)}.pill[data-k=err] .dot{background:var(--err)}
@keyframes pulse{50%{opacity:.35;transform:scale(1.5)}}
#chat{padding:0;justify-content:flex-start;align-items:stretch;background:#fff}
header{display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--bd)}
header .t{flex:1;font-weight:600;font-size:16px;letter-spacing:-.01em}
.chip{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#248a3d;background:rgba(52,199,89,.14);padding:5px 10px;border-radius:99px}
.x{background:none;color:var(--acc);font-size:16px;padding:6px 4px}.x:hover{opacity:.6}
#log{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:6px;max-width:720px;width:100%;margin:0 auto}
.m{max-width:75%;padding:9px 15px;border-radius:20px;font-size:16px;word-wrap:break-word;white-space:pre-wrap;animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.92)}}
.me{align-self:flex-end;color:#fff;background:var(--acc);border-bottom-right-radius:6px}
.them{align-self:flex-start;background:var(--them);border-bottom-left-radius:6px}
.sys{align-self:center;max-width:90%;padding:6px 0;color:var(--mut);font-size:12px;text-align:center;border-radius:0}
#bar{display:flex;gap:8px;align-items:center;padding:10px 14px 14px;max-width:720px;width:100%;margin:0 auto}
#bar input{margin:0;border-radius:99px;padding:12px 18px;background:var(--fill);border:1.5px solid var(--bd)}
#bar input:focus{border-color:var(--acc)}
#snd{width:38px;height:38px;border-radius:50%;flex:none;background:var(--acc);color:#fff;font-size:16px;display:grid;place-items:center}
#snd:hover:not(:disabled){transform:scale(1.1)}#snd:active:not(:disabled){transform:scale(.9)}#snd:disabled{background:#d1d1d6;cursor:default}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<div class="view" id="join"><div class="card">
 <h1>Cifra</h1><p class="sub">Mensajes que solo entiende quien conoce el secreto.</p>
 <input id="room" placeholder="Sala" autocomplete="off" autocapitalize="off">
 <input id="secret" type="password" placeholder="Secreto compartido (frase larga)">
 <button class="go" id="go">Conectar</button>
 <div class="pill" id="pill" data-k="idle"><span class="dot"></span><span id="st">Ambos introducís la misma sala y secreto</span></div>
</div></div>

<div class="view hide" id="chat">
 <header><span class="t">Conversación cifrada</span><span class="chip" id="code"></span><button class="x" id="leave">Salir</button></header>
 <div id="log"></div>
 <div id="bar"><input id="msg" placeholder="Escribe un mensaje" autocomplete="off"><button id="snd" aria-label="Enviar">↑</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const $=id=>document.getElementById(id),enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...u)),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
const rnd=n=>hex(crypto.getRandomValues(new Uint8Array(n)));
const nonce=n=>{const b=new Uint8Array(12);new DataView(b.buffer).setBigUint64(4,BigInt(n));return b};
const cmp=(a,b)=>{for(let i=0;i<a.length;i++)if(a[i]!==b[i])return a[i]-b[i];return 0};
const ECDH={name:'ECDH',namedCurve:'P-256'};
const BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://test.mosquitto.org:8081'];
const myid=rnd(6);
let mqs=[],topic,peer,timer,psk,priv,mine,theirs,sendK,recvK,sn,lastN,ready,shaking,code,up,busy=false,bad=new Set(),seen=new Set(),chain=Promise.resolve();

function setState(k,t){$('pill').dataset.k=k;$('st').textContent=t}
function add(t,c='sys'){const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('log').append(d);$('log').scrollTop=1e9}
function view(v){$('join').classList.toggle('hide',v!=='join');$('chat').classList.toggle('hide',v!=='chat')}
function setBusy(b){busy=b;$('go').textContent=b?'Cancelar':'Conectar'}
function clean(){clearTimeout(timer);mqs.forEach(c=>{try{c.end(true)}catch{}});mqs=[];
 peer=priv=mine=theirs=sendK=recvK=null;sn=0;lastN=-1;ready=shaking=false;up=0;seen.clear();bad.clear()}
function fail(msg){clean();setBusy(false);view('join');setState('err',msg)}

$('go').onclick=async()=>{
 if(busy){clean();setBusy(false);return setState('idle','Ambos introducís la misma sala y secreto')}
 const room=$('room').value.trim(),s=$('secret').value;
 if(!room||s.length<8)return setState('err','Indica sala y un secreto de al menos 8 caracteres');
 if(typeof mqtt==='undefined')return setState('err','No se cargó la librería de red (¿sin internet?).');
 clean();setBusy(true);$('log').innerHTML='';setState('work','Preparando clave segura…');
 const km=await crypto.subtle.importKey('raw',enc.encode(s),'PBKDF2',false,['deriveBits']);
 psk=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode('mensajeria-cifrada-v1'),iterations:600000,hash:'SHA-256'},km,256));
 topic='cifra/'+hex(new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode('room:'+room))));
 const kp=await crypto.subtle.generateKey(ECDH,false,['deriveBits']);
 priv=kp.privateKey;mine=new Uint8Array(await crypto.subtle.exportKey('raw',kp.publicKey));
 if(!busy)return;setState('wait','Esperando a la otra persona…');
 BROKERS.forEach(u=>{const c=mqtt.connect(u,{reconnectPeriod:2000,connectTimeout:6000});mqs.push(c);
  c.on('connect',()=>{up++;c.subscribe(topic,{qos:0},()=>sendPub())});
  c.on('message',(t,p)=>{try{onSig(JSON.parse(p.toString()))}catch{}});c.on('error',()=>{})});
 timer=setTimeout(()=>{if(!up)fail('No se pudo contactar con la red. ¿Tu conexión bloquea WebSockets?')},12000);
};
$('leave').onclick=()=>{clean();setBusy(false);view('join');setState('idle','Ambos introducís la misma sala y secreto')};

function sig(m){const s=JSON.stringify({i:rnd(8),f:myid,...m});mqs.forEach(c=>c.connected&&c.publish(topic,s))}
function sendPub(){if(mine&&!ready)sig({t:'pub',k:b64(mine)})}
function onSig(m){
 if(m.f===myid||seen.has(m.i))return;seen.add(m.i);
 if(m.t==='pub'){if(bad.has(m.f)||(peer&&m.f!==peer)||peer)return;
  peer=m.f;theirs=unb64(m.k);sendPub();setState('work','Verificando clave…');tryShake()}
 else if(m.t==='msg'&&m.f===peer)chain=chain.then(()=>onMsg(m));
}
async function tryShake(){
 if(!mine||!theirs||shaking)return;shaking=true;
 try{
  const pub=await crypto.subtle.importKey('raw',theirs,ECDH,false,[]);
  const dh=await crypto.subtle.deriveBits({name:'ECDH',public:pub},priv,256);
  const hk=await crypto.subtle.importKey('raw',dh,'HKDF',false,['deriveBits']);
  const first=cmp(mine,theirs)<0,[lo,hi]=first?[mine,theirs]:[theirs,mine];
  const k=new Uint8Array(await crypto.subtle.deriveBits({name:'HKDF',hash:'SHA-256',salt:psk,info:new Uint8Array([...enc.encode('msg-v1'),...lo,...hi])},hk,768));
  const key=s=>crypto.subtle.importKey('raw',s,'AES-GCM',false,['encrypt','decrypt']);
  const a=await key(k.slice(0,32)),b=await key(k.slice(32,64));
  sendK=first?a:b;recvK=first?b:a;code=hex(k.slice(64,70)).toUpperCase();await tx('OK');
 }catch{reject()}
}
async function tx(text){const n=sn++,ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:nonce(n)},sendK,enc.encode(text));
 sig({t:'msg',n,d:b64(new Uint8Array(ct))})}
function reject(){bad.add(peer);peer=theirs=sendK=recvK=null;shaking=false;sn=0;lastN=-1;
 setState('err','Secreto distinto o intruso en la sala. Sigo esperando…');sendPub()}
async function onMsg(m){
 if(!recvK||!(m.n>lastN))return;
 try{
  const pt=dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce(m.n)},recvK,unb64(m.d)));lastN=m.n;
  if(!ready){if(pt!=='OK')throw 0;ready=true;clearTimeout(timer);$('code').textContent=code;view('chat');
   $('msg').disabled=$('snd').disabled=false;$('msg').focus();
   return add('Canal cifrado de extremo a extremo · compara el código de arriba con el de la otra persona')}
  add(pt,'them');
 }catch{if(!ready)reject();else add('⚠ Mensaje alterado, descartado.')}
}
async function sendMsg(){const t=$('msg').value.trim();if(!t||!ready)return;$('msg').value='';await tx(t);add(t,'me')}
$('snd').onclick=sendMsg;$('msg').onkeydown=e=>{if(e.key==='Enter')sendMsg()};
['room','secret'].forEach(i=>$(i).onkeydown=e=>{if(e.key==='Enter')$('go').click()});
</script></body></html>
